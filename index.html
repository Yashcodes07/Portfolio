<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Fill the {{TOKENS}} (the compliance gate fails on any left over):
        TITLE        — product name + one-line hook, ≤60 chars
        DESCRIPTION  — ≤155 chars
        CANONICAL    — public origin, no trailing slash (from get-public-url.py)
        THEME_COLOR  — hex matching --color-canvas in src/index.css
      Sites: also drop public/og-image.jpg (1200x630). Apps: og-image optional.
    -->
    <title>Yash Kumar — AI & ML Engineer</title>
    <meta name="description" content="Yash Kumar is an AI and machine learning engineer building machine learning systems and full-stack web products. B.Tech AI & ML student at GGSIPU." />
    <meta name="theme-color" content="#241014" />
    <link rel="canonical" href="https://yashkumar.example/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yash Kumar — AI & ML Engineer" />
    <meta property="og:description" content="Yash Kumar is an AI and machine learning engineer building machine learning systems and full-stack web products. B.Tech AI & ML student at GGSIPU." />
    <meta property="og:url" content="https://yashkumar.example/" />
    <meta property="og:image" content="https://yashkumar.example/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yash Kumar — AI & ML Engineer" />
    <meta name="twitter:description" content="Yash Kumar is an AI and machine learning engineer building machine learning systems and full-stack web products. B.Tech AI & ML student at GGSIPU." />
    <meta name="twitter:image" content="https://yashkumar.example/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link href="https://fonts.bunny.net/css?family=fraunces:500,600,700,800|satoshi:400,500,700&display=swap" rel="stylesheet" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Yash Kumar",
        "jobTitle": "AI & ML Engineer",
        "url": "https://yashkumar.example/",
        "worksFor": { "@type": "Organization", "name": "Yash Kumar" },
        "address": { "@type": "PostalAddress", "addressLocality": "New Delhi", "addressCountry": "IN" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
